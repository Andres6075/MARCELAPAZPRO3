# Configuracion de Gradle para todo el proyecto.
# Usuarios de IDE (como Android Studio):
# Las configuraciones realizadas desde el IDE sobrescribiran
# cualquier ajuste especificado en este archivo.
# Para mas detalles sobre como configurar el entorno de construccion visite
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Especifica los argumentos de la maquina virtual Java (JVM) usados para el proceso daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Cuando esta activado, el bufer de configuracion permite omitir la fase de configuracion si no hay cambios.
org.gradle.configuration-cache=true
# Estilo de codigo Kotlin para este proyecto:
kotlin.code.style=official
